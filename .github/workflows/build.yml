name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备 ffmpeg（runner 自带则直接跳过 apt）
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "runner 已自带 ffmpeg：$(ffmpeg -version | head -n1)"
          else
            echo "未自带，开始安装（限时 5 分钟，防止 apt 源卡死）"
            timeout 300 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            timeout 300 sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n1

      # runner 自带 Android SDK，不再用 setup-android（新版镜像上它会因找不到 tools 包而失败）
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          echo "sdk.dir=$SDK" > local.properties
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKM" ]; then
            echo "找不到 sdkmanager"; ls -R "$SDK" | head -40; exit 1
          fi
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: 还原素材（从上游 dsh-pet 转码）
        run: |
          sudo ln -sf "$(which ffmpeg)" /usr/local/bin/ffmpeg
          chmod +x tools/fetch-and-transcode.sh
          ./tools/fetch-and-transcode.sh

      - name: 补齐未随仓库分发的素材（立绘 + 点击音效）
        run: |
          set -e
          D=app/src/main/res/drawable
          if [ ! -f "$D/whale_cutout.png" ]; then
            echo "缺 whale_cutout.png，用图标顶替"; cp "$D/ic_launcher.png" "$D/whale_cutout.png"
          fi
          if [ ! -f "$D/whale_selfie.png" ]; then
            echo "缺 whale_selfie.png，用图标顶替"; cp "$D/ic_launcher.png" "$D/whale_selfie.png"
          fi
          R=app/src/main/res/raw
          mkdir -p "$R"
          if [ ! -f "$R/tap_press.mp3" ]; then
            echo "合成分按下音效"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=660:duration=0.05" \
              -af "volume=0.35,afade=t=out:st=0.02:d=0.03" -ar 44100 "$R/tap_press.mp3"
          fi
          if [ ! -f "$R/tap_release.mp3" ]; then
            echo "合成分抬起音效"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=990:duration=0.04" \
              -af "volume=0.3,afade=t=out:st=0.015:d=0.025" -ar 44100 "$R/tap_release.mp3"
          fi
          ls -l "$R" ; ls -l "$D" | grep whale || true

      - name: 构建 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-pet-affinity
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 打上 Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 大肥鱼（好感度+喂食）build-${{ github.run_number }}
          body: |
            独立包名 com.dshpet.android.affinity（版本 2.0.0-bond），可与原版大肥鱼桌宠同时安装、各自独立互不影响。
            含好感度 / 饱食度 / 小鱼干喂食系统。首次启动赠送 3 条小鱼干：屏幕上会飘一条蓝色小鱼，按住它拖到大肥鱼身上就能喂；点一下大肥鱼，身旁会浮出一颗逐渐填满的爱心，每填满一个阶段多一颗小爱心。
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
